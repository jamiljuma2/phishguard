services:
  - type: web
    name: phishguard-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PORT
        value: 10000
      # Set these in Render Dashboard (not here — they are secrets)
      # FIREBASE_SERVICE_ACCOUNT_JSON  (paste full JSON content)
      # FIREBASE_DATABASE_URL
      # ZEPTOMAIL_API_KEY
      # ZEPTOMAIL_SENDER_EMAIL
    autoDeploy: true
    rootDir: backend

  - type: web
    name: phishguard-frontend
    runtime: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve -s dist"
    envVars:
      - key: VITE_API_URL
        value: "https://phishguard-1-e2r2.onrender.com"
      # Set these in Render Dashboard (not here — they are secrets)
      # VITE_FIREBASE_API_KEY
      # VITE_FIREBASE_AUTH_DOMAIN
      # VITE_FIREBASE_PROJECT_ID
      # VITE_FIREBASE_STORAGE_BUCKET
      # VITE_FIREBASE_MESSAGING_SENDER_ID
      # VITE_FIREBASE_APP_ID
      # VITE_FIREBASE_MEASUREMENT_ID
    autoDeploy: true
    rootDir: frontend
